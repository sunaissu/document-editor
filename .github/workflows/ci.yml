name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run --json
      - name: Install playground
        if: matrix.node != 18
        run: npm --prefix playground ci
      - name: Build playground
        if: matrix.node != 18
        run: npm run playground:build
      - name: Audit package
        if: matrix.node == 24
        run: npm audit --audit-level=high
      - name: Audit playground
        if: matrix.node == 24
        run: npm --prefix playground audit --audit-level=high
